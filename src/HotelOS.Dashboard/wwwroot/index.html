<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HotelOS — GrandStay Operations Dashboard</title>
  <style>
    :root {
      --clean:#1f9d55; --occupied:#3182ce; --dirty:#dd6b20;
      --cleaning:#805ad5; --maint:#e53e3e; --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:16px 24px; background:#0b1220; border-bottom:1px solid #233; display:flex; justify-content:space-between; align-items:center; }
    header h1 { font-size:18px; margin:0; }
    #status { font-size:13px; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
    .up { background:var(--clean); } .down { background:var(--maint); }
    main { padding:24px; display:grid; grid-template-columns: 2fr 1fr 1fr; gap:20px; }
    .panel { background:var(--panel); border-radius:10px; padding:16px; }
    .panel h2 { margin:0 0 12px; font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:#94a3b8; }
    .rooms { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
    .room { border-radius:8px; padding:10px; color:#fff; min-height:78px; display:flex; flex-direction:column; justify-content:space-between; }
    .room .no { font-weight:700; font-size:16px; }
    .room .meta { font-size:11px; opacity:.9; }
    .room .who { font-size:12px; font-weight:600; }
    .Clean{background:var(--clean);} .Occupied{background:var(--occupied);}
    .Dirty{background:var(--dirty);} .BeingCleaned{background:var(--cleaning);} .Maintenance{background:var(--maint);}
    .item { background:#0b1220; border-radius:7px; padding:8px 10px; margin-bottom:8px; font-size:13px; }
    .item b { color:#fff; }
    .pill { display:inline-block; font-size:11px; padding:2px 7px; border-radius:10px; background:#334155; }
    .pill.Critical{background:#e53e3e;} .pill.High{background:#dd6b20;} .pill.Normal{background:#3182ce;} .pill.Low{background:#475569;}
    .legend { font-size:11px; color:#94a3b8; margin-top:10px; }
    .legend span { margin-right:12px; }
    #login { max-width:340px; margin:80px auto; background:var(--panel); padding:24px; border-radius:10px; }
    #login input { width:100%; padding:10px; margin:10px 0; border-radius:6px; border:1px solid #334; background:#0b1220; color:#fff; }
    #login button { width:100%; padding:10px; border:0; border-radius:6px; background:var(--occupied); color:#fff; font-weight:600; cursor:pointer; }
    .err { color:#fca5a5; font-size:13px; }
    .empty { color:#64748b; font-size:13px; }
  </style>
</head>
<body>
  <div id="login">
    <h1>HotelOS Dashboard</h1>
    <p style="font-size:13px;color:#94a3b8">Enter the operations access token to continue.</p>
    <input id="token" type="password" placeholder="Access token" />
    <button onclick="connect()">View dashboard</button>
    <p id="loginErr" class="err"></p>
  </div>

  <div id="app" style="display:none">
    <header>
      <h1>🏨 HotelOS Operations</h1>
      <nav style="display:flex;gap:16px;font-size:13px">
        <a href="http://localhost:5001" style="color:#94a3b8;text-decoration:none">Reception</a>
        <a href="http://localhost:5002" style="color:#94a3b8;text-decoration:none">Housekeeping</a>
        <a href="http://localhost:5003" style="color:#94a3b8;text-decoration:none">Kitchen</a>
        <a href="http://localhost:5004" style="color:#94a3b8;text-decoration:none">Maintenance</a>
        <a href="http://localhost:5005" style="color:#fff;text-decoration:none">Ops</a>
        <a href="http://localhost:5005/guest.html" style="color:#94a3b8;text-decoration:none">Guest</a>
      </nav>
      <div id="status"><span class="dot down"></span>Connecting…</div>
    </header>
    <main>
      <section class="panel">
        <h2>Rooms</h2>
        <div id="rooms" class="rooms"></div>
        <div class="legend">
          <span><span class="dot" style="background:var(--clean)"></span>Clean</span>
          <span><span class="dot" style="background:var(--occupied)"></span>Occupied</span>
          <span><span class="dot" style="background:var(--dirty)"></span>Dirty</span>
          <span><span class="dot" style="background:var(--cleaning)"></span>Being cleaned</span>
          <span><span class="dot" style="background:var(--maint)"></span>Maintenance</span>
        </div>
      </section>
      <section class="panel">
        <h2>Room Service Orders</h2>
        <div id="orders"></div>
      </section>
      <section class="panel">
        <h2>Maintenance Issues</h2>
        <div id="issues"></div>
      </section>
    </main>
  </div>

<script>
let ws;
function connect() {
  const token = document.getElementById('token').value.trim();
  if (!token) return;
  ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    setStatus(true);
  };
  ws.onclose = () => {
    setStatus(false);
    // If we never opened, it was almost certainly a bad token.
    if (document.getElementById('app').style.display === 'none')
      document.getElementById('loginErr').textContent = 'Connection refused — check the access token.';
  };
  ws.onmessage = (ev) => render(JSON.parse(ev.data));
}
function setStatus(up) {
  document.getElementById('status').innerHTML =
    `<span class="dot ${up ? 'up' : 'down'}"></span>${up ? 'Live' : 'Disconnected'}`;
}
function render(state) {
  if (state.type !== 'snapshot') return;
  // Rooms
  document.getElementById('rooms').innerHTML = (state.rooms || []).map(r => `
    <div class="room ${r.status}">
      <div><span class="no">${r.number}</span> <span class="meta">${r.type} · F${r.floor}</span></div>
      <div class="who">${r.guest ? '👤 ' + escapeHtml(r.guest) : r.status}</div>
    </div>`).join('');
  // Orders
  const orders = state.orders || [];
  document.getElementById('orders').innerHTML = orders.length ? orders.map(o => `
    <div class="item"><b>#${o.id}</b> · Room ${o.room}<br>${escapeHtml(o.summary)}
      <div><span class="pill">${o.status}</span></div></div>`).join('')
    : '<div class="empty">No active orders.</div>';
  // Issues
  const issues = state.issues || [];
  document.getElementById('issues').innerHTML = issues.length ? issues.map(i => `
    <div class="item"><b>Room ${i.room}</b> · ${escapeHtml(i.description)}
      <div><span class="pill ${i.urgency}">${i.urgency}</span>
      <span class="pill">${i.status}</span>${i.technician ? ' · 🔧 ' + escapeHtml(i.technician) : ''}</div></div>`).join('')
    : '<div class="empty">No open issues.</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('token').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
</script>
</body>
</html>
