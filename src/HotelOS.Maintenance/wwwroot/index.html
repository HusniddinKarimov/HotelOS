<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HotelOS — Maintenance</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--ink:#e2e8f0;--muted:#94a3b8;--accent:#e53e3e;--clean:#1f9d55;}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:16px 24px;background:#0b1220;border-bottom:1px solid #233;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:18px;margin:0}.live{font-size:13px;color:var(--muted)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#475569}.dot.on{background:var(--clean)}
  main{padding:24px;display:grid;grid-template-columns:320px 1fr 1fr;gap:20px;align-items:start}
  .panel{background:var(--panel);border-radius:10px;padding:18px}
  .panel h2{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:9px;border-radius:6px;border:1px solid #334;background:#0b1220;color:#fff}
  button{margin-top:12px;padding:9px 12px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:13px}
  button.resolve{background:var(--clean);margin-top:8px}
  .card{background:#0b1220;border-radius:8px;padding:12px;margin-bottom:10px;border-left:4px solid #475569}
  .card.Critical{border-left-color:#e53e3e}.card.High{border-left-color:#dd6b20}.card.Normal{border-left-color:#3182ce}.card.Low{border-left-color:#475569}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#334155;margin-right:6px}
  .pill.Critical{background:#e53e3e}.pill.High{background:#dd6b20}.pill.Normal{background:#3182ce}.pill.Low{background:#475569}
  .tech{font-size:12px;color:var(--muted);margin-bottom:6px}
  .empty{color:#64748b;font-size:13px}.msg{margin-top:10px;font-size:13px;color:#fca5a5}
</style>
</head>
<body>
<header>
  <h1>🔧 Maintenance</h1>
  <nav style="display:flex;gap:16px;font-size:13px">
    <a href="http://localhost:5001" style="color:#94a3b8;text-decoration:none">Reception</a>
    <a href="http://localhost:5002" style="color:#94a3b8;text-decoration:none">Housekeeping</a>
    <a href="http://localhost:5003" style="color:#94a3b8;text-decoration:none">Kitchen</a>
    <a href="http://localhost:5004" style="color:#fff;text-decoration:none">Maintenance</a>
    <a href="http://localhost:5005" style="color:#94a3b8;text-decoration:none">Ops</a>
    <a href="http://localhost:5005/guest.html" style="color:#94a3b8;text-decoration:none">Guest</a>
  </nav>
  <div class="live"><span id="dot" class="dot"></span><span id="livetxt">connecting…</span></div>
</header>
<main>
  <section class="panel">
    <h2>Report a fault</h2>
    <label>Room number</label><input id="m-room" type="number" placeholder="e.g. 105"/>
    <label>Description</label><input id="m-desc" placeholder="e.g. Broken shower"/>
    <label>Urgency</label>
    <select id="m-urg"><option>Critical</option><option>High</option><option selected>Normal</option><option>Low</option></select>
    <button onclick="report()">Submit report</button>
    <div id="m-msg" class="msg"></div>
    <div id="techs" style="margin-top:16px"></div>
  </section>
  <section class="panel">
    <h2>Priority queue (waiting)</h2>
    <div id="queued"></div>
  </section>
  <section class="panel">
    <h2>Assigned to technicians</h2>
    <div id="assigned"></div>
  </section>
</main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){
  const d=await (await fetch('/issues')).json();
  document.getElementById('queued').innerHTML=(d.queued||[]).length?d.queued.map((i,idx)=>`
    <div class="card ${i.urgency}"><div><span class="pill ${i.urgency}">${i.urgency}</span><b>Room ${i.roomNumber}</b></div>
    <div>#${idx+1} in line · ${esc(i.description)}</div></div>`).join(''):'<div class="empty">Queue is empty.</div>';
  document.getElementById('assigned').innerHTML=(d.assigned||[]).length?d.assigned.map(i=>`
    <div class="card ${i.urgency}"><div><span class="pill ${i.urgency}">${i.urgency}</span><b>Room ${i.roomNumber}</b></div>
    <div class="tech">🔧 ${esc(i.technician||'')}</div><div>${esc(i.description)}</div>
    <button class="resolve" onclick="resolve('${i.id}')">Mark resolved</button></div>`).join(''):'<div class="empty">Nothing in progress.</div>';
  document.getElementById('techs').innerHTML='<b style="font-size:12px;color:var(--muted)">TECHNICIANS</b>'+
    (d.technicians||[]).map(t=>`<div class="tech">${t.isAvailable?'🟢':'🔴'} ${esc(t.name)} — ${t.isAvailable?'available':'busy'}</div>`).join('');
}
async function report(){
  const body={roomNumber:+v('m-room'),description:v('m-desc'),urgency:v('m-urg')};
  const r=await fetch('/issues',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  document.getElementById('m-msg').textContent=d.error?d.error:'';
  if(!d.error){document.getElementById('m-desc').value='';}
  refresh();
}
async function resolve(id){await fetch(`/issues/${id}/resolve`,{method:'POST'});refresh();}
const v=id=>document.getElementById(id).value.trim();
function connect(){
  const ws=new WebSocket(`ws://${location.hostname}:5000/broker`);
  ws.onopen=()=>{ws.send(JSON.stringify({action:'subscribe',topic:'*'}));setLive(true);};
  ws.onmessage=()=>refresh();
  ws.onclose=()=>{setLive(false);setTimeout(connect,1500);};
}
function setLive(on){document.getElementById('dot').className='dot'+(on?' on':'');document.getElementById('livetxt').textContent=on?'live':'reconnecting…';}
refresh();connect();
</script>
</body>
</html>
